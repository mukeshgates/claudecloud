<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="style.css"></head>
<body>
<svg class="defs">
  <!-- Cold grade: pull saturation down, cool the shadows, keep skin readable. -->
  <filter id="cold" color-interpolation-filters="sRGB">
    <feColorMatrix type="saturate" values="0.35"/>
    <feComponentTransfer>
      <feFuncR type="table" tableValues="0.03 0.44 0.90"/>
      <feFuncG type="table" tableValues="0.04 0.47 0.92"/>
      <feFuncB type="table" tableValues="0.07 0.53 0.96"/>
    </feComponentTransfer>
  </filter>
</svg>
<div id="stage"></div>
<div class="vig"></div>
<canvas class="grain" width="960" height="540"></canvas>
<script src="engine.js"></script>
<script src="scenes.js"></script>
<script>
  const Q = new URLSearchParams(location.search);
  if (Q.get('alpha')) document.body.classList.add('alpha');
  const name = Q.get('scene') || Object.keys(SCENES)[0];
  if (name === 'lt') SCENES.lt = LOWER_THIRD(Q.get('name') || 'Name', Q.get('role') || 'Role', Q.get('date') || '', Number(Q.get('dur') || 5));
  ENGINE.build(SCENES[name]);
  window.render = t => ENGINE.render(t);
  render(0);
</script>
</body></html>
